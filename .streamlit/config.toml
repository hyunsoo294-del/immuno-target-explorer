[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
# Required for Cloudflare / reverse-proxy WebSocket hosting
enableWebsocketCompression = false

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0e8a7d"
backgroundColor = "#f4f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b1f33"
font = "sans serif"
